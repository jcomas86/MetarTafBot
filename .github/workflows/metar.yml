name: METAR/TAF a Telegram

on:
  schedule:
    # Cada 30 min, unos minutos después de que salgan los METAR (hh:00 y hh:30).
    # Se evita el minuto 0 porque GitHub retrasa o descarta más las ejecuciones a en punto. TestFuncionamiento
    - cron: "8,38 * * * *"
  workflow_dispatch: {}   # permite lanzarlo a mano desde la pestaña Actions

# Necesario para que el workflow pueda hacer commit de estado.json
permissions:
  contents: write

# Nunca dos ejecuciones a la vez (compartirían estado.json)
concurrency:
  group: metar-bot
  cancel-in-progress: false

jobs:
  metar-taf:
    runs-on: ubuntu-latest
    # La ventana interactiva dura como mucho 10 min; esto es solo un tope de seguridad
    timeout-minutes: 15
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Leer comandos y enviar METAR/TAF
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALLOWED_CHAT_ID: ${{ secrets.ALLOWED_CHAT_ID }}
          PYTHONUNBUFFERED: "1"   # que el log se vea en directo
        run: python -m metar_bot.main

      - name: Guardar el estado
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add estado.json
          git diff --quiet --cached || git commit -m "Actualizar estado del bot METAR/TAF"
          git pull --rebase
          git push
