name: Depurar API

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Códigos OACI separados por comas"
        default: "LETO,LEMD,KJFK"

jobs:
  volcar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/volcar_api.py "${{ inputs.ids }}"
